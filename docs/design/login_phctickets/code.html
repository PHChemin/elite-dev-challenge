<!-- Login Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest border border-neutral-gray rounded-lg p-xl md:p-xl shadow-[0_4px_12px_rgba(22,26,29,0.04)]">
<!-- Brand Header -->
<header class="flex flex-col items-center mb-lg">
<img alt="PHCTickets Logo" class="w-24 h-24 object-contain mb-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-dLlfWAr2GEHbhKngupI8Mtey9YzkKjMNZCH1teMNP1KhDiyQzQQoao2j5jMUowSIyzkw_XGlcc5uKiYIIJcn6rK11QDD-hrYyskzDTDjh2d1tylx1YNgOSW8rWQpPHLz0dM8MYPHi8SKA1TpAVWUlS_a9H-bAx9mGRFtRbW-PjxZvq1oR0Uz18lQbGsjyKZxRrH8xJkIYLexRy-IxxA3bbC_7jzXY6tEOzUhN3vBW6gZJe1AFeAbFmIbRAvZDRavbw"/>
<h1 class="font-headline-md text-headline-md text-primary-container text-center">Acesse sua conta</h1>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Input Group -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email</label>
<input class="w-full px-sm py-xs border border-neutral-gray rounded bg-surface-container-lowest font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
<!-- Password Input Group -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Senha</label>
<a class="font-label-sm text-label-sm text-primary-container hover:underline focus:outline-none focus:underline" href="#">Esqueci minha senha</a>
</div>
<input class="w-full px-sm py-xs border border-neutral-gray rounded bg-surface-container-lowest font-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Action -->
<button class="mt-xs w-full bg-primary-container text-on-primary font-label-md text-label-md py-[12px] rounded hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container shadow-[0_2px_4px_rgba(22,26,29,0.08)] transition-all flex items-center justify-center gap-xs" type="submit">
                Entrar
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">login</span>
</button>
</form>
<!-- Registration Link -->
<div class="mt-lg text-center font-body-md text-body-md text-on-surface-variant">
            Ainda não tem conta? <a class="text-primary-container font-label-md hover:underline focus:outline-none focus:underline" href="#">Cadastre-se</a>
</div>
