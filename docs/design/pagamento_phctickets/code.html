        body { background-color: #F5F3F4; }

<body class="font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopNavBar Omitted as per semantic shell mandate for transactional screens -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter">
<div class="w-full max-w-md bg-surface-container-lowest border border-neutral-gray rounded-DEFAULT ambient-shadow overflow-hidden">
<!-- Header -->
<div class="p-md border-b border-neutral-gray flex items-center gap-xs">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">payment</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Pagamento</h1>
</div>
<!-- Content -->
<div class="p-md space-y-lg">
<!-- Order Summary -->
<div class="space-y-sm">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider">Resumo do Pedido</h2>
<div class="bg-surface-bg border border-neutral-gray p-sm rounded-DEFAULT">
<div class="flex justify-between items-start mb-xs">
<div>
<h3 class="font-headline-md text-headline-md text-on-surface leading-tight">Duna: Parte 2</h3>
<p class="font-label-sm text-label-sm text-secondary">Hoje, 20:30 • Sala IMAX 1</p>
</div>
</div>
<div class="mt-sm pt-sm border-t border-neutral-gray">
<div class="flex justify-between items-center py-base">
<span class="font-body-md text-body-md text-on-surface">Meia Entrada (F12)</span>
<span class="font-label-md text-label-md text-on-surface">R$ 25,00</span>
</div>
<div class="flex justify-between items-center py-base">
<span class="font-body-md text-body-md text-on-surface">Inteira (F13)</span>
<span class="font-label-md text-label-md text-on-surface">R$ 50,00</span>
</div>
<div class="flex justify-between items-center py-base">
<span class="font-body-md text-body-md text-secondary">Taxa de Conveniência</span>
<span class="font-label-md text-label-md text-secondary">R$ 7,50</span>
</div>
</div>
<div class="mt-sm pt-sm border-t border-neutral-gray flex justify-between items-center">
<span class="font-headline-md text-headline-md text-on-surface">Total</span>
<span class="font-headline-lg text-headline-lg text-primary-container">R$ 82,50</span>
</div>
</div>
</div>
<!-- Payment Method Simulator (Static) -->
<div class="space-y-sm">
<h2 class="font-label-md text-label-md text-secondary uppercase tracking-wider">Método Selecionado</h2>
<div class="flex items-center gap-sm p-sm border border-neutral-gray rounded-DEFAULT">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<div>
<p class="font-label-md text-label-md text-on-surface">Cartão de Crédito</p>
<p class="font-label-sm text-label-sm text-secondary">Final 4321</p>
</div>
<span class="material-symbols-outlined text-success-valid ml-auto">check_circle</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-sm pt-xs">
<button class="w-full h-12 bg-primary-container text-on-primary font-label-md text-label-md rounded-DEFAULT flex items-center justify-center gap-xs hover:bg-on-primary-fixed transition-colors ambient-shadow">
<span class="material-symbols-outlined">check</span>
                        Aprovar
                    </button>
<button class="w-full h-12 bg-transparent text-on-background border border-[#161A1D] font-label-md text-label-md rounded-DEFAULT flex items-center justify-center gap-xs hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">close</span>
                        Recusar
                    </button>
</div>
</div>
<div class="bg-surface-bg p-sm border-t border-neutral-gray text-center">
<p class="font-label-sm text-label-sm text-secondary flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">lock</span>
                    Ambiente Seguro
                </p>
</div>
</div>

<!-- Footer Omitted as per semantic shell mandate for transactional screens -->
