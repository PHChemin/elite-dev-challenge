<style>
        .seat { transition: all 0.2s ease; }
        .seat:hover:not(.seat-taken):not(.seat-held) { cursor: pointer; transform: scale(1.1); }
        .seat-free { background-color: #ffffff; border: 1px solid #D3D3D3; }
        .seat-free:hover { border-color: #660708; }
        .seat-selected { background-color: #660708; color: #ffffff; border: 1px solid #660708; }
        .seat-held { background-color: #e0e3e7; border: 1px solid #c4c7cb; cursor: not-allowed; opacity: 0.7; }
        .seat-taken { background-color: #161A1D; border: 1px solid #161A1D; cursor: not-allowed; }
        
        .timer-flash { animation: flash 1s infinite alternate; }
        @keyframes flash {
            from { opacity: 1; }
            to { opacity: 0.5; color: #BA181B; }
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Seat Map Generation Logic
            const container = document.getElementById('seat-map-container');
            const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
            const cols = 12;
            const pricePerSeat = 45.00;
            let selectedSeats = [];

            // Simple pseudo-random status assignment for demo purposes
            const getSeatStatus = (r, c) => {
                const rand = Math.random();
                if (r === 'A' || r === 'B') return 'seat-free'; // Premium front
                if (rand > 0.85) return 'seat-taken';
                if (rand > 0.75) return 'seat-held';
                return 'seat-free';
            };

            rows.forEach(rowLabel => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex items-center gap-base justify-center';
                
                // Row Label Left
                const labelLeft = document.createElement('span');
                labelLeft.className = 'font-label-sm text-label-sm w-6 text-center text-on-surface-variant';
                labelLeft.textContent = rowLabel;
                rowDiv.appendChild(labelLeft);

                // Add aisle gap after col 4 and 8
                for (let c = 1; c <= cols; c++) {
                    if (c === 5 || c === 9) {
                        const aisle = document.createElement('div');
                        aisle.className = 'w-sm'; // Aisle width
                        rowDiv.appendChild(aisle);
                    }

                    const seat = document.createElement('div');
                    const status = getSeatStatus(rowLabel, c);
                    const seatId = `${rowLabel}${c}`;
                    
                    seat.className = `w-8 h-8 rounded-DEFAULT flex items-center justify-center font-label-sm text-[10px] seat ${status}`;
                    seat.dataset.id = seatId;
                    seat.dataset.status = status;
                    
                    if (status === 'seat-free') {
                        seat.addEventListener('click', () => toggleSeat(seat, seatId));
                    }

                    rowDiv.appendChild(seat);
                }

                // Row Label Right
                const labelRight = document.createElement('span');
                labelRight.className = 'font-label-sm text-label-sm w-6 text-center text-on-surface-variant';
                labelRight.textContent = rowLabel;
                rowDiv.appendChild(labelRight);

                container.appendChild(rowDiv);
            });

            // Interaction Logic
            function toggleSeat(element, id) {
                if (element.dataset.status === 'seat-taken' || element.dataset.status === 'seat-held') return;

                const index = selectedSeats.indexOf(id);
                if (index > -1) {
                    selectedSeats.splice(index, 1);
                    element.classList.remove('seat-selected');
                    element.classList.add('seat-free');
                    element.dataset.status = 'seat-free';
                } else {
                    if(selectedSeats.length >= 8) {
                        alert('Máximo de 8 assentos permitidos por transação.');
                        return;
                    }
                    selectedSeats.push(id);
                    element.classList.remove('seat-free');
                    element.classList.add('seat-selected');
                    element.dataset.status = 'seat-selected';
                }
                updateSummary();
            }

            function updateSummary() {
                const listEl = document.getElementById('selected-seats-list');
                const priceEl = document.getElementById('total-price');
                const btn = document.getElementById('confirm-btn');

                if (selectedSeats.length > 0) {
                    listEl.textContent = selectedSeats.sort().join(', ');
                    const total = (selectedSeats.length * pricePerSeat).toFixed(2).replace('.', ',');
                    priceEl.textContent = `R$ ${total}`;
                    
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.classList.add('hover:bg-opacity-90');
                } else {
                    listEl.textContent = 'Nenhum';
                    priceEl.textContent = 'R$ 0,00';
                    
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.classList.remove('hover:bg-opacity-90');
                }
            }

            // Simple Timer Logic
            let time = 600; // 10 minutes
            const timerEl = document.getElementById('countdown');
            setInterval(() => {
                if (time <= 0) return;
                time--;
                const min = Math.floor(time / 60);
                const sec = time % 60;
                timerEl.textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
                
                if(time < 60) {
                    timerEl.parentElement.classList.add('timer-flash');
                }
            }, 1000);
        });
    </script>
